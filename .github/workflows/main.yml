name: Update ORCID Publications

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:  # Manual trigger

jobs:
  update-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Fetch ORCID Publications
        uses: fierc3/github-readme-orcid-cards@main
        with:
          orcid_id: '0000-0003-2616-5463'  # Replace with your ORCID
          max_papers: 20
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md cards/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update ORCID publications" && git push)
